html <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn bài cũ</title>
    <style>
        span {
            color: #0000ff;
        }
        .diff-span {
            font-size: 10px;
            color: green;
            border: 20px solid green;
            padding:30px;
            text-align: center;
        }
        #text-center {
            text-align: center;
        }

        .diff-span:hover {
            border: 30px solid red;
        }

        #footer-div {
            text-align: center;
            border: 1px dashed gray;
            padding: 24px;
        }

        .bottom-right {
            position: fixed;       /* cố định theo màn hình */
            bottom: 20px;           /* cách đáy 20px */
            right: 20px;
        }
    </style>
</head>
<body>
    <p>hôm nay</p>
    <span style="color: red">tôi viết bài này</span>
    <span>để ôn bài cũ</span>
    <div id="text-center">
    <span class="diff-span">về HTML</span>
    <span class="diff-span">TEST</span>
    </div>
    <div class="bottom-right">

        <a href="https://www.youtube.com">Go to Youtube</a>
    </div>
</body>
</html>
