<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel Layout</title>
  <link rel="stylesheet" href="layout.css">
  </head>
<body>
  <div class="stage">
    <div class="panel">
      <div class="sidebar">
        <div class="s-top"></div>
        <div class="s-square"></div>
        <div class="s-small"></div>
        <div class="s-small"></div>
      </div>

      <div class="main">
        <div class="top-row">
          <div class="top-col"></div>
          <div class="top-col small"></div>
          <div class="top-col small"></div>
        </div>

        <div class="wide blue"></div>

        <div class="section">
          <div class="left-tall blue"></div>
          <div class="right-list">
            <div class="item"><div class="item-square"></div><div class="item-bar"></div></div>
            <div class="item small"><div class="item-square"></div><div class="item-bar"></div></div>
            <div class="item"><div class="item-square"></div><div class="item-bar"></div></div>
            <div class="item"><div class="item-square"></div><div class="item-bar"></div></div>
          </div>
        </div>

        <div class="wide blue"></div>

        <div class="bottom-rows">
          <div class="b-row"><div class="b-small"></div><div class="b-bar"></div></div>
          <div class="b-row small"><div class="b-small"></div><div class="b-bar"></div></div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
