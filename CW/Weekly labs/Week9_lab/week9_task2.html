<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 9 Task 2</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        canvas {
            border: 1px solid #222;
            background: #fff;
            display: block;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <h2>Task 2: Random Number of Splats</h2>
    <canvas id="artCanvas" width="700" height="500"></canvas>

    <script>
        function drawFilledCircle(ctx, size, xPos, yPos, colour) {
            ctx.beginPath();
            ctx.fillStyle = colour;
            ctx.arc(xPos, yPos, size, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawSplatter(ctx, size, xPos, yPos, colour) {
            for (var i = 0; i < 10; i++) {
                var offsetX = xPos + (Math.random() * 80 - 40);
                var offsetY = yPos + (Math.random() * 80 - 40);
                var splatSize = size * (0.6 + Math.random() * 0.8);
                drawFilledCircle(ctx, splatSize, offsetX, offsetY, colour);
            }
        }

        function draw() {
            var canvas = document.getElementById("artCanvas");
            var ctx = canvas.getContext("2d");
            var colours = ["#e63946", "#1d3557", "#f4a261", "#2a9d8f", "#ffbe0b", "#8338ec"];
            var splatCount = Math.floor(Math.random() * 10) + 8;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fdfdfd";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (var i = 0; i < splatCount; i++) {
                var size = 12 + Math.random() * 18;
                var xPos = 80 + Math.random() * 540;
                var yPos = 70 + Math.random() * 360;
                var colour = colours[Math.floor(Math.random() * colours.length)];
                drawSplatter(ctx, size, xPos, yPos, colour);
            }
        }

        draw();
    </script>
</body>
</html>
