<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <link rel="stylesheet" type="text/css" href="grid.css">
</head>
<body>
<div class="content">
  <div class="grid-container">

    <div class="header"><h1>My Website</h1></div>

    <div class="nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </div>

    <div class="main">
      <h2>Contact Us</h2>
      <p>Fill in the form below and we will get back to you.</p>

      <form action="#" method="post">

        <fieldset>
          <legend>Your Details</legend>

          <div class="form-row">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Your full name">
          </div>

          <div class="form-row">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="your@email.com">
          </div>

          <div class="form-row">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
          </div>

          <div class="form-row">
            <label for="message">Comments:</label>
            <textarea id="message" name="message" rows="5"></textarea>
          </div>
        </fieldset>

        <fieldset>
          <legend>More Info</legend>

          <div class="form-row">
            <label for="heard">How did you hear about us?</label>
            <select id="heard" name="heard">
              <option value="google">Google</option>
              <option value="friend">Friend</option>
              <option value="social">Social Media</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-row">
            <label>Would you visit again?</label>
            <div class="radio-group">
              <label><input type="radio" name="revisit" value="yes"> Yes</label>
              <label><input type="radio" name="revisit" value="no"> No</label>
              <label><input type="radio" name="revisit" value="maybe"> Maybe</label>
            </div>
          </div>

          <div class="form-row">
            <label></label>
            <div class="checkbox-group">
              <label><input type="checkbox" name="signup"> Sign me up for email updates</label>
            </div>
          </div>
        </fieldset>

        <div class="btn-row">
          <input type="reset" value="Reset">
          <input type="submit" value="Submit">
        </div>

      </form>
    </div>

    <div class="aside">
      <h3>Contact Info</h3>
      <p>Email: info@mywebsite.com</p>
      <p>Phone: 01234 567890</p>
    </div>

    <div class="footer"><p>&copy; 2026 My Website. All rights reserved.</p></div>

  </div>
</div>
</body>
</html>
