<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400">
  <rect width="100%" height="100%" fill="#fff"/>
  <!-- Header -->
  <rect x="40" y="20" width="1120" height="70" rx="8" fill="#EDE7F6" stroke="#5E35B1"/>
  <text x="60" y="60" font-family="Arial, sans-serif" font-size="20">Header / Nav</text>

  <!-- Hero -->
  <rect x="40" y="110" width="1120" height="260" rx="8" fill="#E3F2FD" stroke="#0277BD"/>
  <text x="60" y="240" font-family="Arial, sans-serif" font-size="18">Hero (large image, headline, CTA)</text>

  <!-- Featured Programmes -->
  <rect x="40" y="390" width="780" height="200" rx="6" fill="#FFF3E0" stroke="#FB8C00"/>
  <text x="60" y="480" font-family="Arial, sans-serif" font-size="16">Featured Programmes (3-card grid)</text>

  <!-- Sidebar -->
  <rect x="840" y="390" width="320" height="200" rx="6" fill="#F1F8E9" stroke="#2E7D32"/>
  <text x="860" y="480" font-family="Arial, sans-serif" font-size="14">Sidebar (quick links, contact, CTA)</text>

  <!-- Stats -->
  <rect x="40" y="610" width="1120" height="100" rx="6" fill="#FFFDE7" stroke="#F9A825"/>
  <text x="60" y="660" font-family="Arial, sans-serif" font-size="16">Stats / Impact (4 counters)</text>

  <!-- Testimonials -->
  <rect x="40" y="730" width="1120" height="100" rx="6" fill="#F3E5F5" stroke="#8E24AA"/>
  <text x="60" y="780" font-family="Arial, sans-serif" font-size="16">Testimonials (3 cards)</text>

  <!-- CTA Band -->
  <rect x="40" y="850" width="1120" height="80" rx="6" fill="#E8F5E9" stroke="#43A047"/>
  <text x="60" y="900" font-family="Arial, sans-serif" font-size="16">CTA Band (contact / events)</text>

  <!-- Footer -->
  <rect x="40" y="950" width="1120" height="120" rx="6" fill="#ECEFF1" stroke="#607D8B"/>
  <text x="60" y="1000" font-family="Arial, sans-serif" font-size="16">Footer (about, links, contact, socials)</text>
</svg>