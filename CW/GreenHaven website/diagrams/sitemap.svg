  <line x1="370" y1="200" x2="600" y2="300" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="570" y1="200" x2="600" y2="300" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
